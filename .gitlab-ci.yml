# Construit l'app de bureau et publie une Release sur la Forge à chaque tag vX.Y.Z.
#   git tag v0.1.0 && git push origin v0.1.0
# Variable CI optionnelle (Paramètres > CI/CD > Variables, masquée + protégée) : ALBERT_API_KEY.
# ponytail: pas de build macOS (exige un runner macOS), à ajouter si un runner Mac est disponible.

stages: [build, release, deploy]

variables:
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sage/${CI_COMMIT_TAG}"
  UPDATE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sage/latest"

build:
  stage: build
  image: electronuserland/builder:20-wine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - printf 'ALBERT_API_KEY=%s\nALBERT_MODEL=%s\n' "${ALBERT_API_KEY:-}" "${ALBERT_MODEL:-mistral-small-3-2-24b-instruct-2506}" > .env.electron
    - npm ci
    - npm pkg set version="${CI_COMMIT_TAG#v}"
    - node scripts/electron-prepare.mjs
    - CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --linux --win --publish=never
    - 'curl --fail -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file dist-electron/Sage-*-win.exe "${PACKAGE_URL}/Sage-windows.exe"'
    - 'curl --fail -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file dist-electron/Sage-*-linux.AppImage "${PACKAGE_URL}/Sage-linux.AppImage"'
    # Canal de mise à jour automatique (electron-updater, build.publish dans package.json).
    # Les noms d'origine sont conservés : latest*.yml les référence avec leur sha512.
    # Les fichiers .yml sont envoyés en dernier, une fois les binaires en place.
    - |
      for f in dist-electron/Sage-*-win.exe dist-electron/Sage-*-win.exe.blockmap dist-electron/Sage-*-linux.AppImage dist-electron/latest.yml dist-electron/latest-linux.yml; do
        curl --fail -sS -H "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${UPDATE_URL}/$(basename "$f")"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Sage $CI_COMMIT_TAG"
    description: "Application de bureau Sage. Windows : installeur .exe. Linux : AppImage (chmod +x puis lancer)."
    assets:
      links:
        - name: "Windows (installeur)"
          url: "${PACKAGE_URL}/Sage-windows.exe"
          filepath: "/Sage-windows.exe"
          link_type: package
        - name: "Linux (AppImage)"
          url: "${PACKAGE_URL}/Sage-linux.AppImage"
          filepath: "/Sage-linux.AppImage"
          link_type: package

# Page d'accueil publique (GitLab Pages) : contenu de site/.
pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [site/**/*, .gitlab-ci.yml]
  script:
    - rm -rf public && cp -r site public
  artifacts:
    paths: [public]
